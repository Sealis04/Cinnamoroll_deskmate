; Cinnamoroll DeskMate settings (Godot ConfigFile format).
; Read/written by src/SettingsConfig.cs. See plan §6.

[idle]
min_interval_seconds=8
max_interval_seconds=20
sleep_after_seconds=120

[window]
always_on_top=true
canvas_size=512
last_pos_x=-1
last_pos_y=-1

[features]
edge_sitting_enabled=false

[app_reactions]
"Code.exe"="react_sleep"
"chrome.exe"="anim_lookaround"
